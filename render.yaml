# Render blueprint for the BDR FastAPI backend.
# Deploy: push to GitHub, then "New + → Blueprint" in Render and point at this repo.
# Set the secret env vars (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: bdr-api
    runtime: docker
    rootDir: bdr_be
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      # Re-pin the 2FA requirement on every blueprint sync so it can't be
      # silently disabled by dashboard drift. Flip only for break-glass.
      - key: MFA_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        value: https://bpidntbyvoooqvaispup.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_SENDER
        value: bids@g3electrical.com
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://bdr.vercel.app
      - key: PREVIEW_ENGINE
        value: gotenberg
      - key: GOTENBERG_URL
        fromService:
          type: pserv
          name: bdr-gotenberg
          property: hostport   # bare host:port — the app adds http://

  # Office → PDF preview conversion (LibreOffice). Private service: no public URL.
  - type: pserv
    name: bdr-gotenberg
    runtime: image
    image:
      # SECURITY: this container parses UNTRUSTED vendor email attachments
      # (see app/services/rfq_inbox.py), so version bumps are security-relevant.
      # Pinned to a specific minor version instead of the floating `:8` major
      # tag so deploys don't silently pick up a new LibreOffice build.
      # A digest pin (@sha256:...) is stronger — obtain it with:
      #   docker buildx imagetools inspect gotenberg/gotenberg:8.21.1
      # BUT a digest pin MUST be paired with an update cadence (Renovate/
      # Dependabot or a monthly bump task), or it freezes on a CVE-laden
      # LibreOffice build.
      # TODO(owner): append the real @sha256:<digest> using the command above.
      url: docker.io/gotenberg/gotenberg:8.21.1
    plan: starter
